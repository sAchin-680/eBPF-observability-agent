name: release

# A tag is not a release. This builds the artifacts, runs them against the
# kernel matrix, generates checksums and an SBOM, and only then publishes —
# so that a tag pointing at a commit whose BPF objects do not load on 5.15
# cannot become a release anyone can install.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: validate the tagged commit
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        kernel: ["5.15", "6.1", "6.6"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bpf-toolchain

      - name: Build and test
        run: |
          go test ./internal/...
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -o dist/agent ./cmd/agent
          go test -c -o dist/toolchain.test ./test/toolchain
          go test -c -o dist/verifier.test ./test/verifier

      - name: Install QEMU and virtme-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils busybox-static udev
          pipx install virtme-ng || pip install --break-system-packages virtme-ng

      - name: Verify on kernel ${{ matrix.kernel }}
        run: |
          docker create --name ci-kernel "ghcr.io/cilium/ci-kernels:${{ matrix.kernel }}" true >/dev/null
          docker cp ci-kernel:/boot/vmlinuz ./vmlinuz
          docker rm ci-kernel >/dev/null
          chmod +x dist/agent dist/*.test scripts/ci/kernel-smoke.sh
          vng --run ./vmlinuz --user root --verbose \
              --exec "cd $PWD && ./scripts/ci/kernel-smoke.sh dist" | tee smoke.log
          grep -q "0 failed" smoke.log

  publish:
    name: build and publish
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bpf-toolchain

      - name: Build the release binary
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${version}" \
            -o "dist/agent-linux-amd64" ./cmd/agent

      - name: Checksums
        run: |
          cd dist && sha256sum ./* | tee SHA256SUMS
          # The checksum is what makes "the same binary ran on both kernels"
          # checkable by someone who was not there, which is the claim the
          # kernel matrix exists to support.

      - name: Container image
        run: |
          # The same Dockerfile used in development. vmlinux.h is already
          # generated by the composite action above and is read from the build
          # context, because a container build has no kernel BTF to read.
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          # Lowercased because an OCI repository name must be, and this
          # account's login is not. The tag reads fine to a human and is
          # rejected by the registry, which is a slow thing to find out at
          # push time: it took the v1.0-phase4 release with it.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ebpf-observability-agent"
          docker build --build-arg "VERSION=${version}" \
            -t "${image}:${version}" -t "${image}:latest" .
          docker push "${image}:${version}"
          docker push "${image}:latest"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agent-linux-amd64
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
