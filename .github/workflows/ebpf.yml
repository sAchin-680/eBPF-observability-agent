name: ebpf

# The gates that need a kernel.
#
# A successful clang run says almost nothing about an eBPF program: it can
# compile, load on the machine that built it, and be rejected by the verifier on
# a kernel one version older. So this workflow goes the whole way down —
# compile, inspect the object, load it into a real kernel, and do that on more
# than one kernel.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ebpf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything is compiled exactly once, here. The kernel matrix below runs
  # these artifacts and must not rebuild them: NFR5 claims that one binary works
  # across kernels, and a matrix that compiles per kernel tests the toolchain
  # instead and would pass whether or not the claim held.
  compile:
    name: compile and inspect objects
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bpf-toolchain

      - name: Inspect the compiled objects
        run: bash scripts/ci/verify-objects.sh

      - name: Build the artifacts the matrix will run
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -o dist/agent ./cmd/agent
          # Compiled, not run: these need a kernel to load into, which is what
          # the matrix provides.
          go test -c -o dist/toolchain.test ./test/toolchain
          go test -c -o dist/verifier.test ./test/verifier
          sha256sum dist/* | tee dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # The claim under test: the artifacts above load and run on kernels other than
  # the one they were built against.
  #
  # GitHub's runners offer exactly one kernel, so the others are booted in QEMU
  # from the images Cilium publishes for this purpose. 5.15 is in the matrix
  # because it is the oldest kernel this project claims to support and the one
  # most likely to break first.
  kernel-matrix:
    name: kernel ${{ matrix.kernel }}
    needs: compile
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kernel: ["5.15", "6.1", "6.6"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install QEMU and virtme-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils busybox-static udev
          pipx install virtme-ng || pip install --break-system-packages virtme-ng
          vng --version

      - name: Fetch the kernel image
        run: |
          image="ghcr.io/cilium/ci-kernels:${{ matrix.kernel }}"
          docker create --name ci-kernel "$image" true >/dev/null
          docker cp ci-kernel:/boot/vmlinuz ./vmlinuz
          docker rm ci-kernel >/dev/null
          ls -l ./vmlinuz

      - name: Run the artifacts on kernel ${{ matrix.kernel }}
        run: |
          chmod +x dist/agent dist/*.test scripts/ci/kernel-smoke.sh
          # virtme-ng boots the given kernel with the host filesystem as its
          # root, so the artifacts are the same files on disk — nothing is
          # copied into an image, and nothing is rebuilt.
          vng --run ./vmlinuz --user root --verbose \
              --exec "cd $PWD && ./scripts/ci/kernel-smoke.sh dist" \
            | tee smoke.log
          # vng's exit status reflects the VM, not the command inside it, so the
          # result is read from the output. Without this the job passes even
          # when every check inside the VM failed.
          grep -q "0 failed" smoke.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.kernel }}
          path: smoke.log
          retention-days: 7
