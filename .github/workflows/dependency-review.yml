name: dependency-review

# Refuses a pull request that introduces a dependency with a known
# vulnerability, rather than reporting it after it is merged. Pull-request only:
# there is nothing to compare against on a push to main.

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: dependency review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          # Moderate rather than high: this process holds CAP_SYS_ADMIN on every
          # node, so the cost of a dependency problem is higher here than the
          # severity label assumes.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # Copyleft licences would be a distribution problem for a binary
          # shipped as a container image.
          deny-licenses: AGPL-3.0, GPL-3.0
