{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ebpf-agent.fullname" . }}
  namespace: {{ include "ebpf-agent.namespace" . }}
  labels:
    {{- include "ebpf-agent.labels" . | nindent 4 }}
# No Role and no RoleBinding: the agent never calls the Kubernetes API. The
# token is not mounted either — a process holding CAP_SYS_ADMIN should not also
# carry a cluster credential it has no use for.
automountServiceAccountToken: false
{{- end }}
