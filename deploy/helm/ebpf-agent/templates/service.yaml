apiVersion: v1
kind: Service
metadata:
  name: {{ include "ebpf-agent.fullname" . }}-metrics
  namespace: {{ include "ebpf-agent.namespace" . }}
  labels:
    {{- include "ebpf-agent.labels" . | nindent 4 }}
spec:
  # Headless. Each agent reports on its own node, so a load-balanced VIP would
  # return one node's metrics at random and make per-node health unreadable.
  clusterIP: None
  selector:
    {{- include "ebpf-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
