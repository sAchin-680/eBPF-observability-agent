# Prometheus, scoped to agent self-health.
#
# This is not the backend the traced applications' telemetry goes to — that is
# the Tempo and Prometheus stack in deploy/compose. This one exists to answer
# "is the fleet of agents healthy", which is a different question with a
# different audience and, deliberately, a different failure domain.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  # Service discovery: find the agent pods rather than listing node addresses in
  # a config file that goes stale the moment the cluster is resized.
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  # cAdvisor, for the agent's own CPU and memory per node.
  #
  # nodes/proxy is the one that matters and is easy to miss: the scrape goes
  # through the API server at /api/v1/nodes/<name>/proxy/metrics/cadvisor, which
  # is authorised as a proxy subresource, not as nodes/metrics. Without it the
  # target reports 403 and the CPU and memory panels are simply empty — which
  # reads as an agent using no resources rather than as a permissions error.
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # The agents. Discovered by annotation, so a second release — a canary —
      # is picked up without editing this file, which is what makes the rollout
      # visible on one dashboard rather than two.
      - job_name: ebpf-agent
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # The node label is what makes every panel per-node. The agent does
          # not know which node it is on in its metrics — only in its spans — so
          # this is added at scrape time from the pod's scheduling.
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          # release is "canary" or "stable": the same label the Helm chart sets,
          # carried through so a panel can show one against the other.
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            target_label: release

      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics.observability.svc:8080]

      # cAdvisor through the kubelet, for per-node CPU and memory of the agent
      # container itself. Served by the API server proxy so that no port has to
      # be reachable on each node.
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Long enough to look back over a rollout, short enough that the
            # emptyDir below cannot fill a node.
            - --storage.tsdb.retention.time=6h
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # emptyDir, not a PVC. This data is diagnostic and is expected to be
        # thrown away; a volume claim would make the monitoring stack harder to
        # move between clusters than the thing it monitors.
        - name: data
          emptyDir: {}
