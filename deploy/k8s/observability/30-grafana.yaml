# Grafana, provisioned entirely from files.
#
# No dashboard is created by clicking. A dashboard that exists only in a
# browser's local state cannot be reviewed, cannot be restored after the pod is
# rescheduled, and cannot be shown to have changed. The JSON lives in
# deploy/grafana/dashboards/ and is mounted here from a ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        # Fixed uid, referenced by the dashboard JSON. Without it the dashboard
        # loads with an unset datasource and every panel renders empty — which
        # looks exactly like a healthy fleet producing no data.
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: files
        orgId: 1
        type: file
        disableDeletion: true
        # Edits made in the browser are overwritten from disk. That is the
        # intent: the file is the dashboard.
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
      annotations:
        # Rolls the pod when the dashboard JSON changes. Without this, editing a
        # dashboard updates the ConfigMap and the running Grafana keeps serving
        # the old one until something unrelated restarts it.
        checksum/dashboards: "replaced-at-apply-time"
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            # Anonymous read-only access. This is a local diagnostic stack
            # reachable only through a port-forward; a login prompt here would
            # protect nothing and would stop the dashboard being glanced at,
            # which is the entire point of it.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_BASIC_ENABLED
              value: "false"
            - name: GF_USERS_DEFAULT_THEME
              value: dark
            # Opens straight on the agent dashboard rather than on an empty home
            # page.
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/agent-health.json
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          securityContext:
            runAsNonRoot: true
            runAsUser: 472
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources.yaml
        - name: provisioning-dashboards
          configMap:
            name: grafana-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        # Created from deploy/grafana/dashboards/ by scripts/deploy-observability.sh,
        # rather than pasted into this file: one copy of the JSON, and the same
        # copy the compose stack uses.
        - name: dashboards
          configMap:
            name: grafana-dashboards
