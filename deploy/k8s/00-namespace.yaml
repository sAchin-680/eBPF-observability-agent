apiVersion: v1
kind: Namespace
metadata:
  name: ebpf-observability
  labels:
    app.kubernetes.io/name: ebpf-observability-agent
    app.kubernetes.io/part-of: observability
    # The agent runs with capabilities that Pod Security Admission's baseline
    # and restricted profiles both forbid. Labelling the namespace privileged is
    # what makes that an explicit, reviewable decision rather than an admission
    # failure at rollout time on a cluster that enforces it.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
