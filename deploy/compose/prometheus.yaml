global:
  # Short interval because the demo is short. A rate() over a handful of
  # requests needs several samples inside the query window to show anything.
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ebpf-agent
    # The agent runs on the host with kernel privileges, outside this network.
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels:
          # Distinguishes the agent's own telemetry from the telemetry it
          # produces about other services.
          telemetry_kind: agent_self
